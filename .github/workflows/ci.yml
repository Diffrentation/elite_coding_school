name: Quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # The production URI stays in the deployment environment. Next.js only
      # needs a syntactically valid URI while it analyzes API routes in CI.
      - run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/elite_coding_school_ci
      - run: docker build --build-arg MONGODB_URI=mongodb://127.0.0.1:27017/elite_coding_school_ci -t elite-coding-school:ci .
